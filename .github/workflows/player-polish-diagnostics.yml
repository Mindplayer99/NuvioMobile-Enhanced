name: Inspect player polish screenshots
on:
  push:
    branches: [ops/player-polish-diagnostics]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read verified screenshots
        run: |
          gh run download 34857502906 --repo Mindplayer99/NuvioMobile-Enhanced --name orientation-ui-polish-c9d91d761ad49f3d482bde3e42de8eab2470bbaf --dir evidence
          python3 - <<'PY'
          from pathlib import Path
          import base64
          for name in ['portrait-selected-track.png','portrait-subtitle-large-text.png','portrait-audio-label.png']:
              files=list(Path('evidence').rglob(name))
              assert len(files)==1, name
              data=base64.b64encode(files[0].read_bytes()).decode()
              print('PNG_START',name)
              for start in range(0,len(data),8000): print('PNG_DATA',data[start:start+8000])
              print('PNG_END',name)
          PY
